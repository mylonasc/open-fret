name: CPU acceptance
on: [push, pull_request]
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/alphatex_parser/package-lock.json
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: npm ci --prefix tools/alphatex_parser
      - run: python -m pytest tests/ -q
      - run: python scripts/run_pipeline.py --fixture --workspace "$RUNNER_TEMP/open-fret-fixture"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-cpu-acceptance
          path: |
            ${{ runner.temp }}/open-fret-fixture/acceptance.json
            ${{ runner.temp }}/open-fret-fixture/inference.json
            ${{ runner.temp }}/open-fret-fixture/output.tex
