name: Publish interactive viewer demo

on:
  push:
    branches: [main, first-working-training-loop]
    paths:
      - '.github/workflows/pages-demo.yml'
      - 'scripts/build_pages_demo.py'
      - 'open_fret/**'
      - 'ui/tab_data_viewer/dist/**'
      - 'ui/tab_data_viewer/THIRD_PARTY_NOTICES.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.4 pretty_midi==0.2.11.post0 mido==1.3.3
      - uses: actions/configure-pages@v5
      - name: Build synthetic-only static example
        run: python scripts/build_pages_demo.py --output-dir "$RUNNER_TEMP/open-fret-pages"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/open-fret-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
