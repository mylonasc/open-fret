<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>open-fret tab_data_viewer demo</title>
    <!-- WaveRoll piano-roll renderer + AlphaTab score renderer/player -->
    <script src="https://cdn.jsdelivr.net/npm/wave-roll@0.4.0/dist/wave-roll.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@coderline/alphatab@1.3.0/dist/alphaTab.min.js"></script>
    <script src="../dist/tab-data-viewer.umd.js"></script>
  </head>
  <body>
    <h2>open-fret tab_data_viewer demo</h2>
    <p>
      Left: source MIDI notes as a piano roll. Right: predicted tab rendered
      by AlphaTab. One transport drives both: Play/Pause, the seek bar, score
      clicks and roll clicks move the tab cursor and the roll playhead
      together. Bundle: <code>bundle.example.json</code>
    </p>
    <div id="app"></div>
    <script>
      fetch("./bundle.example.json")
        .then((r) => {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then((bundle) => {
          bundle._uid = "demo";
          window.TabDataViewer.mount(document.getElementById("app"), bundle);
        })
        .catch((err) => {
          document.getElementById("app").innerHTML =
            "<p><b>Demo failed to load bundle:</b> " + String(err) + "</p>";
          console.error(err);
        });
    </script>
  </body>
</html>
